<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="description" content="EnglishPage - Aplicación web interactiva móvil y responsive para el repaso de vocabulario, verbos irregulares y gramática en inglés con flashcards 3D." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  
  <title>EnglishPage | Aplicación Interactiva de Repaso</title>

  <!-- Favicon SVG moderno -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%234f46e5%22 stroke-width=%222.2%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z%22/><path d=%22M6 6h10%22/><path d=%22M6 10h10%22/></svg>">

  <!-- Estilos del Sistema -->
  <link rel="stylesheet" href="/src/css/main.css" />
</head>
<body>

  <!-- Encabezado Fijo Superior -->
  <header class="app-header">
    <div class="header-container">
      <!-- Logotipo y Nombre -->
      <a href="#inicio" class="brand" data-nav-link data-target="inicio" id="brand-logo" aria-label="Ir a Inicio de EnglishPage">
        <div class="brand-icon">
          <svg class="svg-icon brand-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m5 8 6 6"/>
            <path d="m4 14 6-6 2-3"/>
            <path d="M2 5h12"/>
            <path d="M7 2h1"/>
            <path d="m22 22-5-10-5 10"/>
            <path d="M14 18h6"/>
          </svg>
        </div>
        <div class="brand-name">English<span>Page</span></div>
      </a>

      <!-- Navegación para Pantallas de Computadora -->
      <nav class="desktop-nav" aria-label="Navegación principal de escritorio">
        <a href="#inicio" class="nav-link active" data-nav-link data-target="inicio" id="nav-desk-inicio">
          <svg class="svg-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Inicio</span>
        </a>
        <a href="#gramatica" class="nav-link" data-nav-link data-target="gramatica" id="nav-desk-gramatica">
          <svg class="svg-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/><path d="M6 10h10"/></svg>
          <span>Gramática</span>
        </a>
        <a href="#vocabulario" class="nav-link" data-nav-link data-target="vocabulario" id="nav-desk-vocabulario">
          <svg class="svg-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="5" y="2" rx="2"/><path d="M5 6H3a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
          <span>Vocabulario</span>
        </a>
        <a href="#verbos" class="nav-link" data-nav-link data-target="verbos" id="nav-desk-verbos">
          <svg class="svg-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          <span>Verbos</span>
        </a>
        <a href="#quiz" class="nav-link" data-nav-link data-target="quiz" id="nav-desk-quiz">
          <svg class="svg-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
          <span>Práctica</span>
        </a>
      </nav>

      <!-- Insignia en cabecera móvil (sustituye al menú redundante) -->
      <div class="mobile-header-badge" aria-label="Nivel B1 y B2">
        <span class="badge-dot"></span>
        <span>Repaso B1-B2</span>
      </div>
    </div>
  </header>

  <!-- Contenedor Principal de Vistas SPA (Solo una activa a la vez) -->
  <main class="main-container" id="main-content">
    
    <!-- 1. Vista: Inicio (#inicio) -->
    <section id="inicio" class="view active" aria-labelledby="brand-logo">
      <div id="inicio-content"></div>
    </section>

    <!-- 2. Vista: Gramática (#gramatica) -->
    <section id="gramatica" class="view" aria-label="Sección de Gramática">
      <div id="grammar-content"></div>
    </section>

    <!-- 3. Vista: Vocabulario (#vocabulario) -->
    <section id="vocabulario" class="view" aria-label="Sección de Vocabulario y Flashcards">
      <div id="vocab-content"></div>
    </section>

    <!-- 4. Vista: Verbos (#verbos) -->
    <section id="verbos" class="view" aria-label="Sección de Verbos Irregulares">
      <div id="verbs-content"></div>
    </section>

    <!-- 5. Vista: Quiz (#quiz) -->
    <section id="quiz" class="view" aria-label="Sección de Desafío Quiz Interactivo">
      <div id="quiz-content"></div>
    </section>

  </main>

  <!-- Barra de Navegación Inferior para Móviles (Thumb-friendly navigation) -->
  <nav class="mobile-bottom-nav" aria-label="Navegación inferior móvil">
    <a href="#inicio" class="bottom-nav-item active" data-nav-link data-target="inicio" id="bnav-inicio">
      <span class="bottom-icon">
        <svg class="svg-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </span>
      <span>Inicio</span>
    </a>
    <a href="#gramatica" class="bottom-nav-item" data-nav-link data-target="gramatica" id="bnav-gramatica">
      <span class="bottom-icon">
        <svg class="svg-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/><path d="M6 10h10"/></svg>
      </span>
      <span>Gramática</span>
    </a>
    <a href="#vocabulario" class="bottom-nav-item" data-nav-link data-target="vocabulario" id="bnav-vocabulario">
      <span class="bottom-icon">
        <svg class="svg-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="5" y="2" rx="2"/><path d="M5 6H3a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      </span>
      <span>Vocabulario</span>
    </a>
    <a href="#verbos" class="bottom-nav-item" data-nav-link data-target="verbos" id="bnav-verbos">
      <span class="bottom-icon">
        <svg class="svg-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </span>
      <span>Verbos</span>
    </a>
    <a href="#quiz" class="bottom-nav-item" data-nav-link data-target="quiz" id="bnav-quiz">
      <span class="bottom-icon">
        <svg class="svg-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
      </span>
      <span>Práctica</span>
    </a>
  </nav>

  <!-- Pie de Página (visible en pantallas grandes) -->
  <footer class="app-footer">
    <div class="footer-content">
      <div>
        <strong>EnglishPage</strong> — Aplicación Web Móvil e Interactiva de Repaso
      </div>
      <div>
        Desarrollado con HTML5, CSS3 puro y JavaScript ES6+ Vanilla
      </div>
    </div>
  </footer>

  <!-- Script Principal de la Aplicación -->
  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
